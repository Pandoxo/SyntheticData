# Real-environment variant: trash dropped into spawn zones marked inside .blend scenes.
#
# Before this works, each scene listed under `scene.files` needs at least one flat
# plane lying on the ground whose name matches `scene.spawn_zone_pattern`. See the
# header of generate_scene.py, and check your scenes with:
#     blenderproc run inspect_blend.py -- --scene <path/to/scene.blend>
#
# resources/example_scene.blend (built by make_example_scene.py) is a minimal, already
# marked-up scene - keep it in the list until your own scenes have zones.

output_dir: "output/scenes"
num_scenes: 200
views_per_scene: 8
seed: 1234

resolution: [960, 720]
render_samples: 32 # real scenes need more samples than a bare plane
noise_threshold: 0.01
denoiser: "OPTIX" # GPU denoise on the RTX 3060; "INTEL" runs OIDN on the CPU
depth_output: false

scene:
  files:
    - "scenes/factory.blend"
    - "scenes/forest.blend"
    - "scenes/forest_2.blend"
    - "scenes/home.blend"
    - "scenes/warta.blend"
    # Add more scenes here once they have spawn_* zones, e.g.:
    # - "resources/example_scene.blend"
    # - "~/blenderkit_data/scenes/urban-streets-an_23adeaad-8d38-4269-9a78-411289484665/urban-streets-and-alleys_c154e791-a0ae-4bfc-845c-ccfeafe7ce7c.blend"
    # - "~/blenderkit_data/scenes/tropical-forest_db8a058d-1381-4fc8-b38e-9aebed4f8a18/tropical-forest_813b8edf-f92a-4622-b2d6-a6e459d74651.blend"
  spawn_zone_pattern: "spawn_.*"
  load_scene_lights: false # true keeps the scene's own lamps; the HDRI usually suffices

objects:
  assets_file: "assets.yaml"
  model_dirs:
    # resources/objects holds one item per .blend. Do not add
    # resources/objects_needs_split: the glob is recursive and those files hold
    # several items each.
    - "resources/objects"
    - "~/blenderkit_data/models"
  min_objects_per_scene: 2
  max_objects_per_scene: 6

hdri:
  folders:
    - "resources/haven/hdris"
    - "~/blenderkit_data/hdrs"
  strength_range: [0.6, 1.4]
  rotation_range_deg: [0, 360] # rotates the sun and every shadow with it
  # Point lights are only added under HDRIs whose filename contains one of these.
  dark_patterns: ["night", "moonless", "dusk", "evening", "lamp", "indoor"]

lights:
  always: false
  type: "POINT"
  count_range: [1, 2]
  energy_range: [50, 300]
  radius_range: [2, 6]

camera:
  focal_length_range_mm: [20, 105]
  # Distance is derived from subject size + focal length; see capture._framing_distance.
  framing_fraction_range: [0.15, 0.70] # wider than the plane config: keeps more context
  distance_limits_m: [0.25, 10.0]
  close_up_probability: 0.35 # chance of framing a single item instead of a cluster
  cluster_radius_m: 1.2 # a view frames one item plus neighbours within this radius
  min_object_frame_fraction: 0.06 # smallest item must span at least this much of the frame
  elevation_range_deg: [10, 75]
  inplane_rotation_range_deg: [-10, 10]
  aim_jitter_frac: 0.3 # off-centre framing, as a fraction of subject size
  min_height_above_poi: 0.15 # keep the camera out of the dirt; null disables
  min_obstacle_distance: 0.2 # reject cameras that clipped into scene geometry
  min_visible_targets: 1 # reject poses where the ray grid finds no trash
  check_rays: 20 # sqrt of the ray grid used by the validity checks
  max_pose_attempts: 120 # real scenes reject far more poses than a bare plane

physics:
  collider: "box" # "mesh" for sloped or uneven zones
  collider_thickness_m: 0.2
  collide_with_scene: false # true also collides with nearby scene meshes (slow)
  scene_collider_margin_m: 0.5
  ground_friction: 0.8
  object_friction: 0.6
  linear_damping: 0.06
  angular_damping: 0.2
  drop_height_range: [0.05, 0.25] # metres above the zone surface
  collider_margin_m: 0.3 # collider extends past the zone so items can roll off it safely
  zone_inset_frac: 0.08 # keep drop points away from the zone edge
  max_placement_tries: 500
  min_simulation_time: 1.0
  max_simulation_time: 6.0
  check_object_interval: 0.5
  substeps_per_frame: 20 # raised from the default 10; thin items tunnel at 10
  solver_iters: 15
  escape_tolerance_m: 1.0 # objects that end up further outside a zone are dropped

annotations:
  min_visible_pixels: 150 # drop annotations smaller than this after occlusion
  drop_frames_without_targets: true
  color_file_format: "PNG"
  mask_encoding_format: "rle" # "rle" or "polygon"
  write_hdf5: false # COCO is the primary output; hdf5 is extra
