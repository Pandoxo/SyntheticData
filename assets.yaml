# Trash asset catalogue.
#
# `longest_m` is the object's longest real-world dimension in metres. Every asset is
# uniformly rescaled on load so its longest bounding-box axis matches this value.
# That is what cancels out the models' inconsistent unit conventions and keeps
# object scale a usable cue for a detector instead of random noise.
#
# Verify after editing with:
#     blenderproc run inspect_blend.py -- --assets
# That prints each asset's native size and the scale factor these numbers imply. The
# factors are meaningless on their own (models ship in mm, cm, m or arbitrary units) -
# what matters is that `longest_m` matches the real item the model depicts.
#
# `match` is a case-insensitive substring of the .blend path. For the converted models
# under resources/objects the path is <dir>/<name>/<name>.blend, so the rules below
# are written as `/<name>/`: the slashes make each one match exactly one model and
# stop e.g. `knife` from swallowing `pocket_knife`. The BlenderKit rules further down
# use bare substrings because those directories carry a UUID suffix.
#
# Every model here holds exactly one item. Files with several items in them (a set of
# plates, three bottles, a pile of knives) live in resources/objects_needs_split and
# are deliberately not on this list - joined into one object each would get a single
# COCO box spanning every part. See that directory's README.

classes:            # category_id 0 is reserved for background / scene geometry
  can: 1
  bottle: 2
  cup: 3
  bag: 4
  paper: 5
  cigarette: 6
  box: 7
  wrapper: 8
  book: 9
  food: 10
  tableware: 11
  knife: 12
  tool: 13
  toy: 14
  electronics: 15
  container: 16
  styrofoam: 17
  stationery: 18
  accessory: 19

defaults:
  collision_shape: CONVEX_HULL   # right for rigid, roughly convex items
  scale_jitter: 0.05             # +-5% around the normalised size

# Files matched by any of these substrings are silently skipped.
ignore:
  # Environment assets, not litter - grass-lawn is a geometry-nodes scatter that has no
  # evaluated mesh at load time, and the wall scan is background geometry.
  - grass-lawn-proce
  - scan-street-wall
  - grass-generic-sm
  - character-model-
  # These three are single objects but unusable as catalogue models: the first two are
  # a large ground plane with a tiny prop sitting on it (the plane is what would get
  # annotated), the third is an unidentifiable scrap of a test scan.
  - /giggle_pacifier/
  - /covid_19_oral_vaccine_inhaler_prototype/
  - /controller_3d_scan_test/

